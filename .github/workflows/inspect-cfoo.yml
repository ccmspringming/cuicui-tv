name: Inspect cfoo Pages project (read-only)

# TEMPORARY diagnostic -- how was cfoo deployed (upload vs Git), and when.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect cfoo
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: cfoo
        run: |
          set -o pipefail
          python3 scripts/cf-pages-inspect.py 2>&1 | tee /tmp/cfoo.txt
          {
            echo '## cfoo Pages project'
            echo ''
            echo '```'
            cat /tmp/cfoo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
