name: Cutover tv.cuicui.de

# One-shot cutover helper: detaches the hostname from the old Pages project so
# the Worker's custom domain can claim it. Idempotent; DRY_RUN by default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (1 = only report, 0 = actually detach)'
        required: true
        default: '1'
      host:
        description: 'Hostname to detach'
        required: true
        default: 'tv.cuicui.de'
      pages_project:
        description: 'Pages project currently holding the hostname'
        required: true
        default: 'libretv'

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Detach hostname from Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_HOST: ${{ inputs.host }}
          PAGES_PROJECT: ${{ inputs.pages_project }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          python3 scripts/cf-detach-domain.py 2>&1 | tee /tmp/cutover.txt
          {
            echo '## Cutover: detach hostname from Pages'
            echo ''
            echo "dry_run=\`${{ inputs.dry_run }}\`  host=\`${{ inputs.host }}\`  project=\`${{ inputs.pages_project }}\`"
            echo ''
            echo '```'
            cat /tmp/cutover.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
