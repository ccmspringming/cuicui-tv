name: Read cfoo ADMIN var

# One-shot: reads the ADMIN env var from the cfoo Pages project configuration.
# The value is masked by GitHub when it matches a registered secret; this prints
# only its length/shape. Used to recover a forgotten panel password.
on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read ADMIN
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: cfoo
        run: |
          set -o pipefail
          python3 scripts/cf-read-admin.py 2>&1 | tee /tmp/admin.txt
          {
            echo '## cfoo ADMIN variable'
            echo ''
            echo '```'
            cat /tmp/admin.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
